{% extends 'detector/base.html' %}

{% block title %}Logged Out | CrackAI{% endblock %}

{% block content %}
<div class="flex items-center justify-center py-20 px-4 fade-in relative z-10">
    <div class="glass card-hover p-10 rounded-2xl w-full max-w-sm text-center shadow-lg border border-slate-200">
        <div class="mb-6">
            <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-400 border border-slate-200 shadow-sm">
                <i class="fas fa-sign-out-alt text-2xl text-slate-500"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 mb-2">Logged Out</h1>
            <p class="text-slate-500">You have successfully logged out.</p>
        </div>
        
        <a href="{% url 'login' %}" class="inline-block w-full btn-interactive bg-blue-600 text-white font-bold py-3 px-6 rounded-xl shadow-md">
            Login Again
        </a>
    </div>
</div>
{% endblock %}
