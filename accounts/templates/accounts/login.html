{% extends 'detector/base.html' %}

{% block title %}Login | StructInsight AI{% endblock %}

{% block content %}
<div class="flex items-center justify-center py-20 px-4 fade-in relative z-10">
    <div class="glass card-hover p-8 rounded-2xl w-full max-w-md shadow-lg border-t-4 border-t-blue-600">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-900">Welcome Back</h1>
            <p class="text-slate-500 text-sm mt-1">Sign in to your dashboard</p>
        </div>

        <form method="post" class="space-y-5">
            {% csrf_token %}
            {% if form.errors %}
                <div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm text-center border border-red-200 shadow-sm">
                    Invalid credentials
                </div>
            {% endif %}

            <div>
                <label class="text-xs font-bold text-slate-500 uppercase ml-1 tracking-wide">Username</label>
                <input type="text" name="username" class="w-full bg-white border border-slate-300 text-slate-900 rounded-lg p-3 mt-1 input-interactive shadow-sm">
            </div>

            <div>
                <label class="text-xs font-bold text-slate-500 uppercase ml-1 tracking-wide">Password</label>
                <input type="password" name="password" class="w-full bg-white border border-slate-300 text-slate-900 rounded-lg p-3 mt-1 input-interactive shadow-sm">
            </div>

            <button type="submit" class="w-full btn-interactive bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md mt-2">
                Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
